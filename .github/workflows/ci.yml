name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Deliberately NOT setting ContinuousIntegrationBuild, DeterministicSourcePaths or
  # enabling SourceLink anywhere in this workflow. ModuleBoundaryTests.RepositoryRoot
  # (Fakturenn.ArchitectureTests) resolves the repository root through
  # [CallerFilePath], a compile-time absolute path baked into the assembly. Any of
  # those settings rewrites that path to /_/tests/... on the build agent, and the
  # loader-omission test then fails on File.Exists. Do not add
  # ContinuousIntegrationBuild=true "by reflex" to a build or publish step below --
  # it silently breaks that test.

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    # Formatting a solution this size takes seconds once restored; the bulk of the
    # budget below covers a cold NuGet restore on a fresh runner.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  build-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    # Restore + Release build + the five in-process suites below. No test counts are
    # stated here on purpose: they moved on almost every task of E02a, and CLAUDE.md
    # dropped its own counts for the same reason -- a stale number invites "something
    # broke" against a baseline nobody updated. Take the numbers from the run.
    #
    # Every suite that needs neither Docker nor a browser belongs in this list. Two of
    # them were missing until this was written, and a compiling-but-never-executed suite
    # is the worst of both worlds: the build break is caught, so it looks covered, while
    # not one assertion ever runs. That silently disarmed
    # The_claims_principal_factory_is_the_permission_factory, the Web.UnitTests guard
    # written specifically because a unit test over a class passes whether or not the
    # class is registered.
    #
    # All five run in low single-digit seconds once built; the budget is dominated by a
    # cold restore and build on a fresh runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test --project tests/Fakturenn.UnitTests --configuration Release --no-build
      - name: Identity module unit tests
        run: dotnet test --project tests/Fakturenn.Modules.Identity.UnitTests --configuration Release --no-build
      - name: Web host unit tests
        run: dotnet test --project tests/Fakturenn.Web.UnitTests --configuration Release --no-build
      - name: Architecture tests
        run: dotnet test --project tests/Fakturenn.ArchitectureTests --configuration Release --no-build
      - name: Compliance tests
        run: dotnet test --project tests/Fakturenn.ComplianceTests --configuration Release --no-build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Testcontainers starts TWELVE postgres:17-alpine containers across the suite, not
    # three: one per each of the ten classes taking IClassFixture<PostgresFixture>, one
    # for the RealHost collection fixture that every host-driving class shares, and one
    # more that DatabaseMigratorTests starts itself to migrate a second clean database.
    # xUnit runs the class-fixture classes in parallel, so these overlap rather than
    # running one after another: sampling `docker ps` once a second through a local run
    # measured a PEAK OF ELEVEN alive at once. That peak, not the total, is what has to
    # fit the runner's memory -- eleven PostgreSQL servers is the number to check against
    # if this job ever starts failing for reasons that are not test failures.
    # The whole suite takes about 45s locally once the image is warm; the budget covers a
    # cold image pull plus restore and build on a fresh runner.
    timeout-minutes: 20
    env:
      # Insurance, NOT a known requirement here. The dev host needs it because a desktop
      # session has already spent most of fs.inotify.max_user_instances and each host
      # this suite builds adds a configuration file watcher; a bare runner has no desktop
      # competing for instances, so the default 128 is probably ample for the hosts above.
      # It is set anyway because the failure mode is unrecognisable: whole classes fail
      # inside FakturennWebApplication.Build with an inotify error that looks nothing like
      # a test failure. Polling costs a little CPU and removes the question.
      DOTNET_USE_POLLING_FILE_WATCHER: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Integration tests
        run: dotnet test --project tests/Fakturenn.IntegrationTests --configuration Release

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    # The suite takes about 93 seconds, not "a few" -- it drives a real browser through
    # first-run setup, TOTP enrolment and several sign-ins. It also needs DOCKER now:
    # AuthenticatedWebAppFixture starts its own postgres:17-alpine container and hosts the
    # real application against it, so this job is no longer browser-only. The rest of the
    # budget covers playwright.ps1 downloading and installing Chromium plus its OS
    # dependencies on a bare runner.
    timeout-minutes: 15
    env:
      # Same insurance as the integration job, and for the same reason: this suite builds
      # a host too. See the comment there.
      DOTNET_USE_POLLING_FILE_WATCHER: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build UI tests
        run: dotnet build tests/Fakturenn.UiTests --configuration Release
      - name: Install browsers
        # playwright.ps1, not the Microsoft.Playwright.CLI global tool: the build
        # step above already generates this script, pinned to the exact
        # Microsoft.Playwright package version this project references (see
        # Directory.Packages.props), so no extra NuGet download or -p indirection
        # is needed. This needs pwsh, which ubuntu-latest ships preinstalled (this
        # workflow runs there, not on the Fedora dev host it was authored on, which
        # has no pwsh -- carry-forward.md documents the global-tool form as the
        # verified alternative for developers on that host). --with-deps installs
        # the OS packages Chromium needs (fonts, libgtk, etc.); a bare runner has
        # none of them, and --with-deps needs root, which the runner user has via
        # passwordless sudo. ubuntu-latest is an officially supported Playwright OS
        # -- unlike the Fedora host, where --with-deps could not be exercised (no
        # non-interactive sudo, unsupported OS), so this flag is chosen but
        # unverified locally.
        run: pwsh tests/Fakturenn.UiTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: UI tests
        run: dotnet test --project tests/Fakturenn.UiTests --configuration Release --no-build

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    # Dominated by the container image build (a few seconds locally, longer on a
    # cold runner with no NuGet/base-image cache) and the readiness poll's own
    # 120s budget; the rest of the sequence (compose up, migrate, teardown) is fast.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build image
        # Restricted to linux-x64 (the runner's own RID) instead of the project's
        # default multi-arch set (linux-x64;linux-arm64, see Fakturenn.Web.csproj).
        # Publishing the full RID list produces an OCI image INDEX, and pushing an
        # index into the local Docker image store requires the containerd image
        # store to be enabled -- confirmed failing locally (error CONTAINER1020)
        # against a Docker-API-compatible daemon without it, and not something this
        # workflow can assume is on for ubuntu-latest. A single-RID image loads into
        # any Docker store and is all the smoke test needs.
        run: dotnet publish src/Fakturenn.Web --configuration Release /t:PublishContainer -p:ContainerImageTag=dev -p:ContainerRuntimeIdentifiers=linux-x64 -p:RuntimeIdentifier=linux-x64
      - name: Start stack
        run: docker compose up --detach
      - name: Apply migrations
        # --profile is required: without it Compose reports the migrate service as
        # missing, because it is profile-gated and not part of the default 'up'.
        run: docker compose --profile migrate run --rm migrate
      - name: Wait for readiness
        run: timeout 120 bash -c 'until curl --silent --fail http://localhost:8080/health; do sleep 3; done'
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
